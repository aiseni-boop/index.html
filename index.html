
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Java 1</title>
</head>
<body>

  <label>Numri i pare</label>
  <input type="number" id="nr1">
  <br>

  <label>Numri i dyte</label>
  <input type="number" id="nr2">
  <br>

  <button type="button" onclick="sum()">+</button>
  <button type="button" onclick="subtract()">-</button>
  
  <button type="button" onclick="times()">x</button>
  <button type="button" onclick="divide()">/</button>

  <p id="result">shuma =</p>
  <p id="result1">zbritje =</p>
    <p id="result2">shumzimi =</p>
  <p id="result3">pjestimi =</p>

  <script>
    function sum() {
      var a = Number(document.getElementById('nr1').value);
      var b = Number(document.getElementById('nr2').value);
      var c = a + b;

      document.getElementById('result').innerHTML=c;
    }

    function subtract() {
      var a = Number(document.getElementById('nr1').value);
      var b = Number(document.getElementById('nr2').value);
      var c = a - b;

      document.getElementById('result1').innerHTML=c;
    }
    function times() {
      var a = Number(document.getElementById('nr1').value);
      var b = Number(document.getElementById('nr2').value);
      var c = a * b;

      document.getElementById('result2').innerHTML=c;
    }
    function divide() {
      var a = Number(document.getElementById('nr1').value);
      var b = Number(document.getElementById('nr2').value);
      var c = a / b;

      document.getElementById('result3').innerHTML=c;
    }
      
  </script>

</body>
</html>
